name: Build Cilgin APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          test -n "$ZIP_FILE" || { echo 'ZIP file not found'; exit 1; }
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          SETTINGS=$(find extracted -name settings.gradle.kts -print -quit)
          test -n "$SETTINGS" || { echo 'settings.gradle.kts not found'; exit 1; }
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: cd "$PROJECT_DIR" && gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cilgin-debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
